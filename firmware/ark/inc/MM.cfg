/*						ARK Project - Adaptive Runtime Kernel

	Module:
		MM.cfg

	Purpose:
		Default compile-time configuration options for the ARK memory manager.

	Description:
		This configuration header provides default memory manager options when the project-specific
		ARK_UsrOpt.h file is not available or does not define a specific option. It selects heap
		protection mode, payload alignment and optional heap diagnostics.

	ARK version:
		1.0

	File revision:
		1.0

	Origin:
		Created for ARK 1.0 from older RTK/MM configuration options.

	Author:
		Paolo Rozzi

	Reviewer:
		---

*/
#ifndef __MM_CFG
	#define __MM_CFG

	#if defined(__has_include)
		#if __has_include("ARK_UsrOpt.h")
			#include "ARK_UsrOpt.h"
			#define MM_USR_OPT_PRESENT 1
		#else
			#define MM_USR_OPT_PRESENT 0
		#endif
	#else
		#define MM_USR_OPT_PRESENT 0
	#endif

	#if !MM_USR_OPT_PRESENT
		#warning "ARK_UsrOpt.h not found; using MM.cfg default options"
	#endif

	/*				Protezione heap:
		Selezionare una sola modalita.

		MALLOC_INTERRUPT_PROTECT:
			Protegge malloc/free disabilitando globalmente gli interrupt. Consente l'uso da ISR,
			ma introduce una latenza non deterministica.
		MALLOC_SCHEDULER_PROTECT:
			Protegge malloc/free mascherando PendSV. Non protegge da accessi da ISR.
		MALLOC_SEMAPHORE_PROTECT:
			Protegge malloc/free tramite semaforo. Non deve essere usata da ISR e puo introdurre
			priority inversion.
	*/
	#ifndef MALLOC_INTERRUPT_PROTECT
		#define MALLOC_INTERRUPT_PROTECT 1
	#endif
	#ifndef MALLOC_SCHEDULER_PROTECT
		#define MALLOC_SCHEDULER_PROTECT 0
	#endif
	#ifndef MALLOC_SEMAPHORE_PROTECT
		#define MALLOC_SEMAPHORE_PROTECT 0
	#endif
	
	/*				PAYLOAD_ALIGN_4
			Da definire a 1 se si desidera che l'indirizzo del payload dell'heap sia un puntatore
		ad una WORD del micro, in modo da ottimizzare gli accessi al BUS. Se vale 0, il payload
		viene arrotondato ad 8 bytes, adatto anche per l'allocazione di stack.
			Nel primo caso, quando si alloca memoria per una task, si deve tenere presente che lo
		stack potrebbe dover essere riallineato per evitare run time errors.
	*/
	#ifndef PAYLOAD_ALIGN_4
		#define PAYLOAD_ALIGN_4 0
	#endif

	//				BIG_HEAP vale 1 se l'Heap eccede 64K.
	#ifndef BIG_HEAP
		#define BIG_HEAP 1
	#endif

	/*				BLOCK_COUNTER
		Vale 1 se si desidera avere un contatore che viene incrementato ad ogni allocazione
		riuscita e decrementato ad ogni disallocazione. Il valore deve battere pari con il
		numero di blocchi allocati.
	*/
	#ifndef BLOCK_COUNTER
		#ifdef DEBUG
			#define BLOCK_COUNTER 1
		#else
			#define BLOCK_COUNTER 0
		#endif
	#endif

	/*				MALLOC_TEST
		Vale 1 per fermarsi in debug se ci sono errori nell'heap prima o dopo l'esecuzione
		di una malloc o di una free.
	*/
	#ifndef MALLOC_TEST
		#ifdef DEBUG
			#define MALLOC_TEST 1
		#else
			#define MALLOC_TEST 0
		#endif
	#endif

	/*				MALLOC_GUARD
		Vale 1 per aggiungere una WORD di guardia alla fine del blocco.
	*/
	#ifndef MALLOC_GUARD
		#ifdef DEBUG
			#define MALLOC_GUARD 1
		#else
			#define MALLOC_GUARD 0
		#endif
	#endif

#endif
